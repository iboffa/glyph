name: Glyph verification
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[bench]"
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.codegen
      - run: python -m benchmarks.agent
      - run: python -m benchmarks.runtime --samples 5
      - run: python -m benchmarks.report
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-results-${{ matrix.os }}
          path: benchmarks/results/
