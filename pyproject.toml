[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-lang"
version = "0.1.0"
description = "A compact, statically typed language with a Clang/LLVM native backend"
requires-python = ">=3.11"
dependencies = ["ziglang==0.14.1"]

[project.optional-dependencies]
bench = ["tiktoken==0.12.0", "psutil==7.2.2"]

[project.scripts]
glyph = "glyph.cli:main"

[tool.setuptools.package-data]
glyph = ["runtime.h"]

[tool.setuptools.packages.find]
include = ["glyph*"]
